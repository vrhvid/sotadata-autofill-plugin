<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <form onsubmit="event.preventDefault()">
            <label for="callsign">Default Callsign</label>
            <input id="callsign" type="text" size="25" maxlenght="20"><br><br>
            <label for="band">Default Band</label>
            <select id="band">
                <option value="VLF">VLF</option>
                <option value="1.8MHz">1.8MHz</option>
                <option value="3.5Mhz">3.5Mhz</option>
                <option value="5MHz">5MHz</option>
                <option value="7MHz">7MHz</option>
                <option value="10MHz">10MHz</option>
                <option value="14MHz">14MHz</option>
                <option value="18MHz">18MHz</option>
                <option value="21MHz">21MHz</option>
                <option value="24MHz">24MHz</option>
                <option value="28MHz">28MHz</option>
                <option value="40MHz">40MHz</option>
                <option value="50MHz">50MHz</option>
                <option value="60MHz">60MHz</option>
                <option value="70MHz">70MHz</option>
                <option value="144MHz">144MHz</option>
                <option value="220MHz">220MHz</option>
                <option value="433MHz">433MHz</option>
                <option value="900MHz">900MHz</option>
                <option value="1240MHz">1240MHz</option>
                <option value="2.3GHz">2.3GHz</option>
                <option value="3.4GHz">3.4GHz</option>
                <option value="5.6GHz">5.6GHz</option>
                <option value="10GHz">10GHz</option>
                <option value="24GHz">24GHz</option>
                <option value="Microwave">Microwave</option>
            </select><br><br>
            <label for="mode">Default Mode</label>
            <select id="mode">
                <option value="AM">AM</option>
                <option value="CW">CW</option>
                <option value="DATA">DATA</option>
                <option value="DV">DV</option>
                <option value="FM">FM</option>
                <option value="OTHER">OTHER</option>
                <option value="SSB">SSB</option>
            </select><br><br>
            <input type="submit" value="SAVE SETTINGS"><br><br>
        </form>
        <button>DISCARD CHANGES</button>
    </body>
</html>
